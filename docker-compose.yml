services:
  botmux:
    build:
      context: .
      dockerfile: Dockerfile
    image: botmux:local
    container_name: botmux
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - botmux-data:/data
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  botmux-data:
  ollama_data:
